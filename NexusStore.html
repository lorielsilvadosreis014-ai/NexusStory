.card{position:relative;width:100%;max-width:400px;margin-top:-64px;padding:58px 22px 22px;border-radius:30px;border:1.5px solid rgba(165,107,255,.55);background:rgba(16,9,30,.55);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);box-shadow:0 0 36px rgba(165,107,255,.25),inset 0 0 0 1px rgba(255,138,61,.2)}
.logo{position:absolute;left:50%;top:-40px;width:80px;transform:translateX(-50%);filter:drop-shadow(0 0 12px rgba(255,138,61,.55))}
h1{font:700 28px Orbitron,sans-serif;letter-spacing:.04em;text-align:center;margin:0}
.sub{text-align:center;font-size:11px;letter-spacing:.34em;color:var(--pu);margin:8px 0 0 .34em;font-weight:500}
.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin:18px 0 20px}
.chip{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.08);white-space:nowrap}
.chip svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6}
.c1{color:#ffc27a}.c2{color:#b9a2ff}.c3{color:#ff9a7a}
.field{display:flex;align-items:center;gap:12px;height:54px;padding:0 18px;margin-bottom:14px;border-radius:99px;background:rgba(255,255,255,.08);border:1.2px solid rgba(165,107,255,.5)}
.field>svg{flex:none;width:22px;height:22px;fill:none;stroke:#cfc6e6;stroke-width:1.7}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--txt);font:500 16px Inter,sans-serif}
.field input::placeholder{color:#d9d2ec}
.field:focus-within{border-color:var(--or);box-shadow:0 0 0 3px rgba(255,138,61,.3)}
.eye{background:none;border:0;padding:0;display:flex;cursor:pointer}
.eye svg{width:24px;height:24px;fill:none;stroke:#cfc6e6;stroke-width:1.7}
.link{background:none;border:0;padding:0;font:inherit;cursor:pointer;color:var(--or)}
.forgot{align-self:flex-end;font-size:14px;font-weight:600;margin:0 4px 6px 0}
.msg{min-height:20px;margin:0 0 6px;text-align:center;font-size:14px;color:var(--err)}
.go{width:100%;height:56px;border:0;border-radius:99px;color:#fff;font:700 24px Inter,sans-serif;cursor:pointer;background:linear-gradient(90deg,#ff7a2f,#f0453a 45%,#7b4bd8);box-shadow:0 0 20px rgba(255,120,50,.4),inset 0 0 0 1px rgba(255,200,150,.5)}
.go:active{transform:scale(.98)}
.or{display:flex;align-items:center;gap:12px;margin:20px 0 14px;font-size:12px;letter-spacing:.18em;color:var(--mute)}
.or:before,.or:after{content:"";flex:1;height:1px;background:rgba(255,255,255,.18)}
.soc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.soc button{height:50px;display:flex;align-items:center;justify-content:center;gap:9px;border-radius:16px;border:1.2px solid rgba(165,107,255,.5);background:rgba(255,255,255,.08);color:var(--txt);font:600 16px Inter,sans-serif;cursor:pointer}
.soc svg{width:24px;height:24px}
.alt{text-align:center;margin:20px 0 0;font-size:15px;color:#dcd5ee}
.alt .link{display:block;margin:4px auto 0;font-size:19px;font-weight:700;background:linear-gradient(90deg,var(--or),var(--pu));-webkit-background-clip:text;background-clip:text;color:transparent}
button:focus-visible{outline:3px solid var(--or);outline-offset:2px}
/* carregamento */
.ld{position:fixed;inset:0;overflow:hidden;background:#0b0713;z-index:10}

hctog:d=>{if(!can('home'))return deny();const k=d.id,c=hc(k),vis=catOrder().filter(x=>hc(x).on!==0);if(!CAT[k])return;if(c.on!==0&&vis.length<2)return toast('Deixe ao menos uma categoria visível.');D.home.cats[k]=Object.assign(c,{on:c.on===0?1:0});A('Categoria '+(D.home.cats[k].on===0?'ocultada':'exibida')+': '+catN(k),'');sv();renderC()},
hcup:d=>hmove(d.id,-1),hcdn:d=>hmove(d.id,1),
menu:()=>$('dr').classList.toggle('open'),exit:()=>exitA(),
nav:d=>{AV=d.id;AQ='';AS='all';renderA()},rng:d=>{AR=d.id;renderC()},flt:d=>{AS=d.id;renderC()},tip:(d)=>toast(d.t),
odet:d=>odet(d.id),
osc:d=>{if(!can('w'))return deny();modal(`<h3>${ST[d.s]}?</h3><p>${d.s==='PAID'?'Confirme que o pagamento foi realmente recebido. Sem webhook do provedor, esta confirmação é manual e fica registrada no histórico.':d.s==='CANCELLED'||d.s==='REFUNDED'?'O estoque dos itens será devolvido.':'Atualizar o status do pedido.'}</p>${inp('osn','','Nota (opcional)',' maxlength="200"')}<button class="btn" style="width:100%;margin-top:10px" data-ad="osok" data-id="${d.id}" data-s="${d.s}">Confirmar</button>`)},
osok:d=>{if(!can('w'))return deny();if(setSt(d.id,d.s,$('osn').value.trim()))odet(d.id);renderC()},
onote:d=>{const o=D.orders.find(x=>x.n==d.id),t=$('onn').value.trim();if(!o||!t||!can('ord'))return;o.notes.push({by:ADM.email,t:t.slice(0,200),d:Date.now()});A('Nota no pedido #'+o.n,'nota interna');sv();odet(o.n)},
pform:d=>can('w')?pform(d.id):deny(),
pimg:(d,t)=>readImg(t,u=>{TI=u;const i=$('pvi');i.src=u;i.classList.remove('hide')}),
psave:d=>{if(!can('w'))return deny();const n=$('pn2').value.trim(),ds=$('pd2').value.trim(),p=num($('pp2').value),pr=$('ppr2').value.trim()?num($('ppr2').value):0,st=parseInt($('ps2').value,10),c=$('pc2').value;
if(n.length<2)return toast('Nome muito curto.');if(!(p>0&&p<=1e5))return toast('Preço inválido.');if(pr&&!(pr>0&&pr<p))return toast('A promoção deve ser menor que o preço.');if(!(st>=0&&st<=1e6))return toast('Estoque inválido.');if(!CAT[c])return toast('Categoria inválida.');
let o=d.id?pid(d.id):null;if(d.id&&!o)return;const ch=[];
if(o){if(o.stock!==st){D.mov.unshift({t:Date.now(),p:o.id,n:n,q:st-o.stock,r:'Edição do produto',by:ADM.email});ch.push('estoque '+o.stock+'→'+st)}if(o.p!==p)ch.push('preço '+o.p+'→'+p);if(o.n!==n)ch.push('nome');Object.assign(o,{n,d:ds,p,promo:pr,stock:st,c,on:$('pon2').checked?1:0,ft:$('pft2').checked?1:0,img:TI});A('Produto editado: '+n,ch.join(', ')||'dados atualizados')}
else{o={id:'p'+Date.now(),n,d:ds,p,promo:pr,stock:st,c,on:$('pon2').checked?1:0,ft:$('pft2').checked?1:0,img:TI};D.products.push(o);if(st)D.mov.unshift({t:Date.now(),p:o.id,n,q:st,r:'Estoque inicial',by:ADM.email});A('Produto criado: '+n,R(p))}
if(sv()){close();renderC();toast('Produto salvo')}},
ptog:d=>{if(!can('w'))return deny();const p=pid(d.id);p.on=p.on?0:1;A('Produto '+(p.on?'ativado':'desativado')+': '+p.n,'');sv();renderC()},
pdel:d=>{if(!can('w'))return deny();const p=pid(d.id);modal(`<h3>Excluir produto?</h3><p>${esc(p.n)} será removido da loja. Pedidos antigos mantêm o nome do item.</p><button class="btn" style="width:100%" data-ad="pdok" data-id="${p.id}">Excluir definitivamente</button>`)},
pdok:d=>{if(!can('w'))return deny();const p=pid(d.id);D.products=D.products.filter(x=>x.id!==d.id);A('Produto excluído: '+p.n,'');sv();close();renderC()},
cdet:d=>{const u=d.id,O=D.orders.filter(o=>o.user===u),T=D.tickets.filter(t=>t.user===u);modal(`<h3>${esc(mask(u))}</h3><div class="card2"><small>Conta criada: ${D.cust[u]?dt(D.cust[u].c):'—'}<br>Pedidos: ${O.length} · Gasto: ${R(O.filter(paid).reduce((a,o)=>a+o.tot,0))}<br>Chamados de suporte: ${T.length}<br>Situação: ${D.susp[u]?'suspensa':'ativa'}</small></div>${can('w')&&D.admins[u]!=='OWNER'&&u!==ADM.email?`<button class="btn o sm" data-ad="csus" data-id="${esc(u)}">${D.susp[u]?'Reativar conta':'Suspender conta'}</button>`:''}<h4>Pedidos</h4>${O.slice().reverse().map(oRow).join('')||empty}<h4>Suporte</h4>${T.map(t=>`<button class="card2 rw" data-ad="tadm" data-id="${t.id}">#${t.id} ${esc(t.sj)} · ${TS[t.st]}</button>`).join('')||empty}`)},
csus:d=>{if(!can('w'))return deny();modal(`<h3>${D.susp[d.id]?'Reativar':'Suspender'} conta?</h3><p>${D.susp[d.id]?'O cliente poderá entrar novamente.':'O cliente não conseguirá entrar enquanto a conta estiver suspensa. Informe o motivo.'}</p>${inp('sr','','Motivo',' maxlength="150"')}<button class="btn" style="width:100%;margin-top:10px" data-ad="csok" data-id="${esc(d.id)}">Confirmar</button>`)},
csok:d=>{if(!can('w'))return deny();const r=$('sr').value.trim();if(!D.susp[d.id]&&r.length<3)return toast('Informe o motivo.');if(D.susp[d.id])delete D.susp[d.id];else D.susp[d.id]=1;A('Conta '+(D.susp[d.id]?'suspensa':'reativada')+': '+d.id,r);sv();close();renderC()},
cform:d=>can('w')?cform(d.id):deny(),
csave:d=>{if(!can('w'))return deny();const code=d.id||$('cc').value.trim().toUpperCase(),ty=$('ct').value,v=num($('cv').value),lm=parseInt($('cl').value||0,10),mn=num($('cm').value||0);
if(!/^[A-Z0-9]{3,20}$/.test(code))return toast('Código: 3 a 20 letras ou números.');if(!(v>0)||(ty==='pct'&&v>100))return toast('Valor de desconto inválido.');if(!(lm>=0)||!(mn>=0))return toast('Limite ou mínimo inválido.');
let c=D.coupons.find(x=>x.code===code);if(!d.id&&c)return toast('Esse código já existe.');const nw={code,type:ty,val:v,exp:$('ce').value,limit:lm,min:mn,first:$('cf1').checked?1:0,on:$('con').checked?1:0};
if(c)Object.assign(c,nw);else D.coupons.push(Object.assign(nw,{used:0}));A('Cupom '+(d.id?'editado':'criado')+': '+code,'');sv();close();renderC()},
ctog:d=>{if(!can('w'))return deny();const c=D.coupons.find(x=>x.code===d.id);c.on=c.on?0:1;A('Cupom '+(c.on?'ativado':'desativado')+': '+c.code,'');sv();renderC()},
cdel:d=>{if(!can('w'))return deny();D.coupons=D.coupons.filter(x=>x.code!==d.id);A('Cupom excluído: '+d.id,'');sv();renderC()},
sadj:d=>{if(!can('w'))return deny();const p=pid(d.id);modal(`<h3>Ajustar estoque</h3><p>${esc(p.n)} · atual: ${p.stock}</p>${lab('Nova quantidade')}${inp('sq',p.stock,'','inputmode="numeric"')}${lab('Motivo')}${inp('sr2','','Ex.: reposição',' maxlength="100"')}<button class="btn" style="width:100%;margin-top:10px" data-ad="sok" data-id="${p.id}">Salvar</button>`)},
sok:d=>{if(!can('w'))return deny();const p=pid(d.id),q=parseInt($('sq').value,10),r=$('sr2').value.trim();if(!(q>=0&&q<=1e6)||r.length<3)return toast('Informe quantidade válida e o motivo.');if(q!==p.stock){D.mov.unshift({t:Date.now(),p:p.id,n:p.n,q:q-p.stock,r,by:ADM.email});A('Estoque ajustado: '+p.n,p.stock+'→'+q);p.stock=q;sv()}close();renderC()},
ffil:()=>{AF.from=$('f1').value;AF.to=$('f2').value;renderC()},
csv:d=>{CSVT=csvOf(d.id);modal(`<h3>CSV</h3><p><small>Copie e cole numa planilha. O download direto não funciona nesta página.</small></p><textarea class="ta csv" readonly>${esc(CSVT)}</textarea><button class="btn" style="margin-top:8px" data-ad="csvc">Copiar CSV</button>`)},
csvc:()=>{try{navigator.clipboard.writeText(CSVT).then(()=>toast('CSV copiado'),()=>toast('Não foi possível copiar'))}catch(e){toast('Não foi possível copiar')}},
asend:()=>{if(!can('w'))return deny();const t=$('an-t').value.trim();if(t.length<3)return toast('Escreva a mensagem.');D.ann.push({id:Math.max(0,...D.ann.map(a=>a.id))+1,t:t.slice(0,300),kind:$('an-k').value,d:Date.now(),by:ADM.email});A('Notificação enviada',t.slice(0,60));sv();renderC();toast('Enviada')},
tadm:d=>{if(!can('sup'))return deny();tth(+d.id,'a')},
ttpl:d=>{$('trt').value=TPL[d.i][1]},
tarep:d=>{if(!can('sup'))return;const t=D.tickets.find(x=>x.id==d.id),x=$('trt').value.trim();if(!t||!x)return;t.msgs.push({f:'a',by:ADM.email,t:x.slice(0,500),d:Date.now()});if(t.st==='OPEN')t.st='PROGRESS';(D.notes[t.user]=D.notes[t.user]||[]).push({t:'Nova resposta no seu chamado #'+t.id+'.',r:0,d:Date.now()});A('Resposta no chamado #'+t.id,'');sv();tth(t.id,'a');renderC()},
tmeta:d=>{if(!can('sup'))return;const t=D.tickets.find(x=>x.id==d.id);t.st=$('tst').value;t.asg=$('tas').value;A('Chamado #'+t.id,TS[t.st]+(t.asg?' · '+t.asg:''));sv();renderC();toast('Salvo')},
slogo:(d,t)=>readImg(t,u=>{if(!can('set'))return deny();D.set.logo=u;A('Logo alterada','');if(sv())renderC()}),
ssave:()=>{if(!can('set'))return deny();const f=num($('s-f').value||0),b=parseInt($('s-b').value||0,10);if(!(f>=0&&f<=100)||!(b>=0))return toast('Taxa ou limite inválido.');const s=D.set;Object.assign(s,{name:$('s-n').value.trim().slice(0,40)||'NEXUS STORE',desc:$('s-d').value.trim(),mail:$('s-m').value.trim(),wa:$('s-w').value.trim(),ig:$('s-i').value.trim(),dc:$('s-c').value.trim(),prov:$('s-p').value,fee:f,low:b,maint:$('s-x').checked?1:0});A('Configurações salvas',s.maint?'manutenção ligada':'');sv();toast('Configurações salvas')},
tadd:()=>{if(!can('team'))return deny();const u=$('t-u').value,r=$('t-r').value;if(!users().includes(u)||!ROLE[r])return;D.admins[u]=r;A('Administrador adicionado: '+u,r);sv();renderC()},
trole:d=>{if(!can('team')||d.id===ADM.email)return deny();const r=$('r-'+d.i).value;if(!ROLE[r])return;if(D.admins[d.id]==='OWNER'&&r!=='OWNER'&&Object.values(D.admins).filter(x=>x==='OWNER').length<2)return toast('Mantenha ao menos um OWNER.');D.admins[d.id]=r;A('Função alterada: '+d.id,r);sv();renderC()},
trem:d=>{if(!can('team')||d.id===ADM.email)return deny();if(D.admins[d.id]==='OWNER'&&Object.values(D.admins).filter(x=>x==='OWNER').length<2)return toast('Mantenha ao menos um OWNER.');delete D.admins[d.id];A('Administrador removido: '+d.id,'');sv();renderC()}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-ad]');if(!t||!S)return;const k=t.dataset.ad;if(t.tagName==='INPUT'&&t.type==='file')return;ld();
if(ACT[k]){if(k==='promo'||t.tagName!=='INPUT'||true)return ACT[k](t.dataset,t)}
if(!ADM||!AA[k])return;lastA=Date.now();if(k==='menu'&&e.target.closest('.drp')&&!e.target.closest('[data-ad="nav"]'))return;AA[k](t.dataset,t)});
